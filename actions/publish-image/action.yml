name: 'Publish image to Infomaniak Object Storage'
description: 'Uploads a directory of artifacts to Infomaniak Object Storage (Ceph S3, single source of truth), generates an HTML index, and optionally syncs the version to the latest/ alias.'

# Bucket model: one public bucket per distribution, named after `os_name`, in
# the Infomaniak Public Cloud project `Images_Storage`. The bucket must exist
# before this action runs: the action does not create buckets. Path inside
# the bucket: `<version>/<filename>`, plus an optional `latest/` mirror.
# Public reads go through the images-router Worker (images.openimages.cloud).

inputs:
  os_name:
    description: 'OS / repo slug. Also used as the bucket name (e.g., "alpaquita-linux") unless overridden via bucket_name.'
    required: true
  version:
    description: 'Version string used as the path segment under the bucket.'
    required: true
  artifacts_dir:
    description: 'Local directory whose contents will be uploaded.'
    required: true
  bucket_name:
    description: 'Bucket name override. Empty (default) → falls back to os_name.'
    required: false
    default: ''
  also_latest:
    description: 'If "true", mirror the version directory under latest/ inside the bucket.'
    required: false
    default: 'true'

  s3_endpoint:
    description: 'S3 endpoint of Infomaniak Object Storage.'
    required: false
    default: 'https://s3.gva2.infomaniak.cloud'
  s3_region:
    description: 'SigV4 signing region.'
    required: false
    default: 'gva2'
  s3_key_id:
    required: true
  s3_secret:
    required: true

runs:
  using: composite
  steps:
    - name: Validate inputs and resolve bucket
      id: resolve
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        OS_NAME: ${{ inputs.os_name }}
        VERSION: ${{ inputs.version }}
        BUCKET_NAME: ${{ inputs.bucket_name }}
      run: |
        set -euo pipefail
        if [[ ! -d "$ARTIFACTS_DIR" ]]; then
          echo "::error::artifacts_dir does not exist: $ARTIFACTS_DIR"
          exit 1
        fi
        for v in "$OS_NAME" "$VERSION"; do
          if [[ -z "$v" || "$v" =~ \.\. || "$v" =~ / ]]; then
            echo "::error::invalid path segment: '$v'"
            exit 1
          fi
        done
        # Bucket = explicit bucket_name override, else os_name (per-distro bucket model).
        bucket="${BUCKET_NAME:-$OS_NAME}"
        if [[ "$bucket" =~ \.\. || "$bucket" =~ / ]]; then
          echo "::error::invalid bucket name: '$bucket'"
          exit 1
        fi
        echo "Bucket resolved: $bucket"
        echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

    - name: Install aws-cli if missing
      shell: bash
      run: |
        set -euo pipefail
        if command -v aws >/dev/null; then
          aws --version
          exit 0
        fi
        tmp=$(mktemp -d)
        curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "$tmp/awscliv2.zip"
        unzip -q "$tmp/awscliv2.zip" -d "$tmp"
        "$tmp/aws/install" --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli >/dev/null
        rm -rf "$tmp"
        aws --version

    - name: Configure aws-cli for Ceph S3
      shell: bash
      env:
        S3_REGION: ${{ inputs.s3_region }}
      run: |
        set -euo pipefail
        # Ceph RGW: path-style addressing, and only send/validate checksums
        # when the API requires them (aws-cli >= 2.23 defaults to CRC
        # checksums on every request, which some RGW versions reject).
        cfg="$RUNNER_TEMP/oic-aws-config"
        cat > "$cfg" <<CFG
        [default]
        region = ${S3_REGION}
        request_checksum_calculation = when_required
        response_checksum_validation = when_required
        s3 =
            addressing_style = path
        CFG
        echo "AWS_CONFIG_FILE=$cfg" >> "$GITHUB_ENV"

    - name: Enrich MANIFEST with sha512, size, virtual_size, firmware, arch
      # Additive fields for machine consumers (index.json, oic-sync, Glance
      # os_hash_value which is sha512 by default, Proxmox disk sizing).
      # Done here once instead of in the three build workflows; bash, jq
      # and coreutils only, which every builder container has.
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
      run: |
        set -euo pipefail
        cd "$ARTIFACTS_DIR"
        shopt -s nullglob
        for m in MANIFEST*.json; do
          f=$(jq -r '.filename // empty' "$m")
          if [[ -z "$f" || ! -f "$f" ]]; then
            echo "::warning::$m: image file '$f' not found, not enriched"
            continue
          fi
          sha512=$(sha512sum "$f" | cut -d' ' -f1)
          size=$(stat -c %s "$f")
          # qcow2 header: magic "QFI\xfb", virtual size = big-endian u64 at offset 24.
          vsize=null
          if [[ $(od -An -tx1 -N4 "$f" | tr -d ' \n') == "514649fb" ]]; then
            vsize=0
            for b in $(od -An -tu1 -j24 -N8 "$f"); do vsize=$(( vsize * 256 + b )); done
          fi
          # Same rule as the runtime smoke: "uefi" in the filename means the
          # image needs UEFI firmware; otherwise it boots with the default
          # (BIOS) firmware of OpenStack and Proxmox.
          firmware=bios
          [[ "$f" == *uefi* ]] && firmware=uefi
          arch=x86_64
          [[ "$f" == *aarch64* || "$f" == *arm64* ]] && arch=aarch64
          jq --arg sha512 "$sha512" --argjson size "$size" --argjson vsize "$vsize" \
             --arg firmware "$firmware" --arg arch "$arch" \
             '. + {sha512: $sha512, size: $size, virtual_size: $vsize, firmware: $firmware, arch: $arch}' \
             "$m" > "$m.tmp" && mv "$m.tmp" "$m"
          echo "$m: size=$size virtual_size=$vsize firmware=$firmware arch=$arch"
        done

    - name: Generate index.html for the version directory
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        OS_NAME: ${{ inputs.os_name }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        cd "$ARTIFACTS_DIR"
        {
          cat <<HTML
        <!DOCTYPE html>
        <html lang="en"><head>
        <meta charset="utf-8">
        <title>${OS_NAME} ${VERSION}: Open Images</title>
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <style>
          body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:960px;margin:2rem auto;padding:0 1rem;color:#222}
          h1{border-bottom:1px solid #ccc;padding-bottom:.5rem}
          table{border-collapse:collapse;width:100%}
          th,td{text-align:left;padding:.4rem .8rem;border-bottom:1px solid #eee}
          a{color:#0660d8;text-decoration:none}a:hover{text-decoration:underline}
          .size{text-align:right;color:#666;font-variant-numeric:tabular-nums}
          footer{margin-top:2rem;color:#888;font-size:.9rem}
          code{background:#f5f5f5;padding:.1rem .3rem;border-radius:3px}
        </style></head><body>
        <h1>${OS_NAME} / ${VERSION}</h1>
        <p>Verify with <code>sha256sum -c SHA256SUMS</code> · signatures via <code>cosign verify-blob</code></p>
        <table><tr><th>File</th><th class="size">Size</th></tr>
        HTML
          for f in $(find . -maxdepth 1 -type f -not -name 'index.html' -printf '%f\n' | sort); do
            size=$(stat -c %s "$f")
            if   [[ $size -ge 1073741824 ]]; then h=$(awk -v s="$size" 'BEGIN{printf "%.2f GB",s/1073741824}')
            elif [[ $size -ge 1048576    ]]; then h=$(awk -v s="$size" 'BEGIN{printf "%.2f MB",s/1048576}')
            elif [[ $size -ge 1024       ]]; then h=$(awk -v s="$size" 'BEGIN{printf "%.2f KB",s/1024}')
            else                                   h="${size} B"
            fi
            printf '<tr><td><a href="%s">%s</a></td><td class="size">%s</td></tr>\n' "$f" "$f" "$h"
          done
          cat <<HTML
        </table>
        <footer>Built $(date -u +%Y-%m-%dT%H:%M:%SZ) · <a href="https://github.com/open-img-cloud/${OS_NAME}">source</a> · <a href="https://openimages.cloud">openimages.cloud</a></footer>
        </body></html>
        HTML
        } > index.html

    - name: Upload versioned artifacts
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts_dir }}
        DEST_PREFIX: s3://${{ steps.resolve.outputs.bucket }}/${{ inputs.version }}/
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        AWS_ACCESS_KEY_ID: ${{ inputs.s3_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3_secret }}
      run: |
        set -euo pipefail
        aws s3 cp \
          --recursive --no-progress \
          --cache-control "public, max-age=31536000, immutable" \
          --endpoint-url "$S3_ENDPOINT" \
          "$ARTIFACTS_DIR" "$DEST_PREFIX"

    - name: Sync version to latest/
      if: inputs.also_latest == 'true'
      shell: bash
      env:
        SRC: s3://${{ steps.resolve.outputs.bucket }}/${{ inputs.version }}/
        DST: s3://${{ steps.resolve.outputs.bucket }}/latest/
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        AWS_ACCESS_KEY_ID: ${{ inputs.s3_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3_secret }}
      run: |
        set -euo pipefail
        aws s3 sync \
          --delete --no-progress \
          --cache-control "public, max-age=300" \
          --metadata-directive REPLACE \
          --endpoint-url "$S3_ENDPOINT" \
          "$SRC" "$DST"

    - name: Rebuild versions.json at the bucket root
      # Lists every published version with its MANIFEST(s), so clients can
      # pin or roll back (the bucket root has no listing). Rebuilt from the
      # bucket contents on every publish rather than appended to, so that
      # variant jobs publishing concurrently converge on a complete file.
      shell: bash
      env:
        BUCKET: ${{ steps.resolve.outputs.bucket }}
        OS_NAME: ${{ inputs.os_name }}
        S3_ENDPOINT: ${{ inputs.s3_endpoint }}
        AWS_ACCESS_KEY_ID: ${{ inputs.s3_key_id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.s3_secret }}
      run: |
        set -euo pipefail
        work=$(mktemp -d)
        aws s3 cp --recursive --no-progress --only-show-errors \
          --exclude '*' --include '*/MANIFEST*.json' --exclude 'latest/*' \
          --endpoint-url "$S3_ENDPOINT" "s3://${BUCKET}/" "$work/m/"
        shopt -s nullglob globstar
        files=("$work"/m/*/MANIFEST*.json)
        if [[ ${#files[@]} -eq 0 ]]; then
          echo "::warning::no MANIFEST found in s3://${BUCKET}/, versions.json not written"
          exit 0
        fi
        jq -s --arg name "$OS_NAME" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
          map(select(.version != null)) as $ms
          | {
              schema: "oic-versions/v1",
              name: $name,
              generated_at: $now,
              versions: ($ms | group_by(.version)
                | map({
                    version: .[0].version,
                    built_at: (map(.built_at) | max),
                    artifacts: (sort_by(.variant // "") | map({
                      variant, filename, sha256, sha512, size, virtual_size, firmware, arch,
                      path: (.version + "/" + .filename),
                      manifest: (.version + "/" + (if .variant then "MANIFEST-" + .variant + ".json" else "MANIFEST.json" end))
                    }))
                  })
                | sort_by(.built_at) | reverse)
            }' "${files[@]}" > "$work/versions.json"
        jq -c '{name, versions: [.versions[] | .version]}' "$work/versions.json"
        aws s3 cp --no-progress --only-show-errors \
          --cache-control "public, max-age=300" --content-type application/json \
          --endpoint-url "$S3_ENDPOINT" "$work/versions.json" "s3://${BUCKET}/versions.json"
        rm -rf "$work"
