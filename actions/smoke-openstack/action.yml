name: 'Smoke an openimages.cloud image on a live OpenStack'
description: |
  Final-stage runtime check. Imports the just-published qcow2 from the
  CDN into a real OpenStack (default: Infomaniak Public Cloud), boots a
  throwaway instance, waits for cloud-init to finish, SSHes in, runs a
  short health probe, then tears everything down. Returns non-zero on
  any failure so the release run goes red.

  Required secrets (passed from the caller workflow):
    OS_AUTH_URL                    e.g. https://api.pub1.infomaniak.cloud/identity/v3
    OS_REGION_NAME                 e.g. dc3-a
    OS_APPLICATION_CREDENTIAL_ID
    OS_APPLICATION_CREDENTIAL_SECRET

inputs:
  os_name:
    description: 'Repo slug used as bucket prefix and CDN path segment.'
    required: true
  version:
    description: 'Version string (matches the published path).'
    required: true
  filename:
    description: 'Artifact filename (e.g. alpine-3.23.4-bios-x86_64.qcow2).'
    required: true
  cdn_hostname:
    description: 'Public CDN hostname.'
    required: false
    default: 'images.openimages.cloud'
  login_user:
    description: |
      Default cloud-init user for SSH. Distro-specific. Examples:
      alpine, alpaquita, ec2-user (Amazon Linux), cloud-user (Oracle),
      debian, nixos. Override per-caller.
    required: true
  flavor:
    description: 'Nova flavor name. Default sized for any oic image.'
    required: false
    default: 'a2-ram4-disk20-perf1'
  external_network:
    description: 'Name of the external (floating-IP) network on the target cloud. Default matches Infomaniak Public Cloud.'
    required: false
    default: 'ext-floating1'
  boot_timeout:
    description: 'Seconds to wait for the instance to reach ACTIVE.'
    required: false
    default: '180'
  ssh_timeout:
    description: 'Seconds to wait for SSH + cloud-init to be ready.'
    required: false
    default: '300'

  # --- secrets bridged through inputs (composite actions can't read secrets directly) ---
  os_auth_url:
    description: 'Pass-through of secrets.OS_AUTH_URL.'
    required: true
  os_region_name:
    description: 'Pass-through of secrets.OS_REGION_NAME (used when `regions` is empty).'
    required: true
  regions:
    description: 'Space-separated regions; one is picked at random per smoke run (empty: use os_region_name).'
    required: false
    default: 'dc3-a dc4-a'
  os_application_credential_id:
    description: 'Pass-through of secrets.OS_APPLICATION_CREDENTIAL_ID.'
    required: true
  os_application_credential_secret:
    description: 'Pass-through of secrets.OS_APPLICATION_CREDENTIAL_SECRET.'
    required: true

runs:
  using: composite
  steps:
    - name: Probe smoke prerequisites
      id: prereq
      shell: bash
      env:
        OS_AUTH_URL:                       ${{ inputs.os_auth_url }}
        OS_APPLICATION_CREDENTIAL_ID:      ${{ inputs.os_application_credential_id }}
        OS_APPLICATION_CREDENTIAL_SECRET:  ${{ inputs.os_application_credential_secret }}
      run: |
        if [[ -z "${OS_AUTH_URL:-}" || -z "${OS_APPLICATION_CREDENTIAL_ID:-}" || -z "${OS_APPLICATION_CREDENTIAL_SECRET:-}" ]]; then
          echo "::notice::Runtime smoke skipped, OS_AUTH_URL / OS_APPLICATION_CREDENTIAL_* secrets not configured. Add them at the org level (open-img-cloud) to enable the smoke."
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        else
          echo "should_run=true"  >> "$GITHUB_OUTPUT"
        fi

    - name: Install openstack CLI
      if: steps.prereq.outputs.should_run == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v openstack >/dev/null; then
          openstack --version
          exit 0
        fi
        # Minimal build containers (e.g. ubuntu:24.04 for the Nix flake
        # engine) lack python3 and the ssh client the smoke needs.
        missing=()
        for bin in python3 ssh ssh-keygen curl; do
          command -v "$bin" >/dev/null || missing+=("$bin")
        done
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "Installing missing tools: ${missing[*]}"
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              python3 python3-venv openssh-client curl ca-certificates >/dev/null
          elif command -v dnf >/dev/null; then
            dnf install -y -q python3 openssh-clients curl ca-certificates
          elif command -v apk >/dev/null; then
            apk add --no-cache python3 openssh-client curl ca-certificates
          else
            echo "::error::cannot install ${missing[*]}: no apt-get, dnf or apk"
            exit 1
          fi
        fi
        # Preferred: a private virtualenv. Distro Pythons that are
        # "externally managed" (PEP 668, e.g. Ubuntu 24.04) refuse a
        # system-wide pip install.
        venv="${RUNNER_TEMP:-/tmp}/osc-venv"
        if python3 -m venv "$venv" 2>/dev/null; then
          "$venv/bin/pip" install --quiet --disable-pip-version-check python-openstackclient
          echo "$venv/bin" >> "$GITHUB_PATH"
          "$venv/bin/openstack" --version
          exit 0
        fi
        # Fallback: the libguestfs builder image (ghcr.io/stackopshq/libguestfs-tools)
        # ships python3 but not pip/pipx nor the venv module. Bootstrap pip via get-pip.py so
        # the action works in any minimal container without pulling extra
        # packages into the build image.
        if ! python3 -c "import pip" 2>/dev/null; then
          curl -fsSL https://bootstrap.pypa.io/get-pip.py -o /tmp/get-pip.py
          python3 /tmp/get-pip.py --quiet --no-warn-script-location
          rm -f /tmp/get-pip.py
        fi
        python3 -m pip install --quiet --no-warn-script-location \
          --user --break-system-packages python-openstackclient 2>/dev/null \
          || python3 -m pip install --quiet --no-warn-script-location \
               --user python-openstackclient
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        openstack --version

    - name: Smoke
      id: smoke
      if: steps.prereq.outputs.should_run == 'true'
      shell: bash
      env:
        OS_AUTH_URL:                       ${{ inputs.os_auth_url }}
        OS_REGION_NAME:                    ${{ inputs.os_region_name }}
        OS_AUTH_TYPE:                      v3applicationcredential
        OS_APPLICATION_CREDENTIAL_ID:      ${{ inputs.os_application_credential_id }}
        OS_APPLICATION_CREDENTIAL_SECRET:  ${{ inputs.os_application_credential_secret }}
        OS_IDENTITY_API_VERSION:           '3'
        OS_INTERFACE:                      public
        OS_NAME:                           ${{ inputs.os_name }}
        VERSION:                           ${{ inputs.version }}
        FILENAME:                          ${{ inputs.filename }}
        CDN:                               ${{ inputs.cdn_hostname }}
        LOGIN_USER:                        ${{ inputs.login_user }}
        FLAVOR:                            ${{ inputs.flavor }}
        EXTNET:                            ${{ inputs.external_network }}
        BOOT_TIMEOUT:                      ${{ inputs.boot_timeout }}
        SSH_TIMEOUT:                       ${{ inputs.ssh_timeout }}
        REGIONS:                           ${{ inputs.regions }}
      run: |
        set -euo pipefail
        SUMMARY="$GITHUB_STEP_SUMMARY"
        ok()  { echo "::notice::✅ $1"; printf -- "- ✅ %s\n" "$1" >> "$SUMMARY"; }
        bad() { echo "::error::❌ $1"; printf -- "- ❌ **%s**\n" "$1" >> "$SUMMARY"; FAIL=1; }
        info(){ echo "ℹ️  $1"; }
        FAIL=0

        # Spread smokes over the available regions (same project and
        # credential in each): catches region-specific breakage over time.
        if [[ -n "${REGIONS// /}" ]]; then
          read -ra region_list <<< "$REGIONS"
          OS_REGION_NAME="${region_list[RANDOM % ${#region_list[@]}]}"
          export OS_REGION_NAME
        fi
        echo "region=$OS_REGION_NAME" >> "$GITHUB_OUTPUT"
        info "Region: $OS_REGION_NAME"
        echo "Region: \`$OS_REGION_NAME\`" >> "$SUMMARY"

        # Per-run unique identifier. GITHUB_RUN_ID is monotonic across the
        # whole org so re-dispatches at the same commit never collide
        # (which used to happen with SHORT_SHA + RUN_ATTEMPT and produce
        # "More than one Image exists" at boot time).
        # Multi-variant callers (alpine bios/uefi, alpaquita glibc/musl) run
        # one smoke per matrix job inside the SAME run: add a short hash of
        # the filename, plus the run attempt, so parallel jobs and re-runs
        # never share keypair / security group / server / image names.
        FILE_HASH="$(printf '%s' "$FILENAME" | sha256sum | cut -c1-8)"
        TAG="oic-smoke-${OS_NAME}-${VERSION}-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-${FILE_HASH}"
        # Sanitize: Nova rejects '.' (and friends) in keypair names. The
        # universal-safe charset across image/server/keypair/security
        # group on most clouds is [a-zA-Z0-9_-]. Replace anything else
        # with '-' so versions like 3.23.4 don't poison the keypair call.
        TAG="$(printf '%s' "$TAG" | tr -c 'A-Za-z0-9_-' '-')"
        # OpenStack object names: image/server/keypair/secgroup share the
        # tag so cleanup is single-pass on tag match.
        IMG_NAME="$TAG"
        SRV_NAME="$TAG"
        KEY_NAME="$TAG"
        SG_NAME="$TAG"
        IMG_URL="https://${CDN}/${OS_NAME}/${VERSION}/${FILENAME}"

        # Publish the tag as a step output BEFORE any provisioning so the
        # Cleanup step still runs (and removes whatever did get created)
        # if a later command fails.
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        echo "## Runtime smoke: \`${OS_NAME}/${VERSION}/${FILENAME}\` on Infomaniak" >> "$SUMMARY"
        echo "" >> "$SUMMARY"
        info "Tag: $TAG"
        info "Image URL: $IMG_URL"

        # Local SSH keypair (private kept on runner, public uploaded).
        WORK=$(mktemp -d)
        trap 'rm -rf "$WORK"' EXIT
        ssh-keygen -t ed25519 -N '' -f "$WORK/id" -C "$TAG" >/dev/null
        PUBKEY="$(cat "$WORK/id.pub")"

        # ---- 0. Auth probe ----
        if ! openstack token issue -f value -c id >/dev/null 2>&1; then
          bad "OpenStack auth failed: check OS_* secrets"
          exit 1
        fi
        ok "Auth OK against $OS_AUTH_URL ($OS_REGION_NAME)"

        # UEFI-only artefacts (e.g. alpine-*-uefi-*) must be booted with OVMF:
        # without hw_firmware_type=uefi Nova boots SeaBIOS and the guest
        # never comes up. Detect from the filename.
        FW_PROPS=()
        if [[ "$FILENAME" == *uefi* ]]; then
          FW_PROPS=(--property hw_firmware_type=uefi --property hw_machine_type=q35)
          info "UEFI artefact: setting hw_firmware_type=uefi, hw_machine_type=q35"
        fi

        # ---- 1. Glance: create record, then web-download (fall back to local upload if unsupported) ----
        info "Glance: creating image record $IMG_NAME"
        openstack image create \
          --disk-format qcow2 --container-format bare \
          --tag "$TAG" \
          --property hw_qemu_guest_agent=yes "${FW_PROPS[@]}" \
          "$IMG_NAME" >/dev/null

        info "Glance: triggering web-download import from $IMG_URL"
        if openstack image import \
            --method web-download \
            --uri "$IMG_URL" \
            "$IMG_NAME" 2>/tmp/img-import.err; then
          info "web-download import accepted: polling for status=active"
          # Async path: image starts as 'queued', flips to 'importing',
          # then 'active' once the cloud finishes pulling. Use a fresh
          # deadline based on wall clock, NOT $SECONDS, so we get the
          # full 10 min regardless of how long earlier work took.
          deadline=$(( $(date +%s) + 600 ))
          status=""
          while (( $(date +%s) < deadline )); do
            status=$(openstack image show -f value -c status "$IMG_NAME" 2>/dev/null || echo "")
            [[ "$status" == "active" ]] && break
            [[ "$status" == "killed" ]] && { bad "Glance import failed (status=killed)"; exit 1; }
            sleep 10
          done
          if [[ "$status" != "active" ]]; then bad "Glance import timed out (status=$status)"; exit 1; fi
        else
          # Cloud disallows web-download → fetch locally and upload via
          # --file. \`image create --file\` is synchronous: when it
          # returns successfully the image is already 'active', so no
          # poll loop is needed. The upload itself can take minutes on
          # slow uplinks; that's expected.
          info "web-download unavailable on this cloud: falling back to fetch + re-upload"
          cat /tmp/img-import.err >&2 || true
          # Remove any pre-existing image record(s) with the same name:
          # plain \`image delete <name>\` fails on multi-match, so iterate
          # over IDs to be safe.
          for id in $(openstack image list -f value -c ID --name "$IMG_NAME" 2>/dev/null); do
            openstack image delete "$id" >/dev/null 2>&1 || true
          done
          curl -fsSL "$IMG_URL" -o "/tmp/${FILENAME}"
          info "Uploading $(du -h /tmp/${FILENAME} | cut -f1) to Glance (synchronous)…"
          openstack image create \
            --disk-format qcow2 --container-format bare \
            --file "/tmp/${FILENAME}" \
            --tag "$TAG" \
            --property hw_qemu_guest_agent=yes "${FW_PROPS[@]}" \
            "$IMG_NAME" >/dev/null
          rm -f "/tmp/${FILENAME}"
        fi
        ok "Glance image active"

        # ---- 2. Keypair + security group ----
        openstack keypair create --public-key "$WORK/id.pub" "$KEY_NAME" >/dev/null
        openstack security group create --description "$TAG" "$SG_NAME" >/dev/null
        openstack security group rule create --proto tcp --dst-port 22 "$SG_NAME" >/dev/null
        openstack security group rule create --proto icmp "$SG_NAME" >/dev/null
        ok "Keypair + security group created"

        # ---- 3. Pick a tenant network ----
        # First non-external network that has an IPv4 subnet: the network
        # order differs per region and some are IPv6-only (ext-v6only1 comes
        # first in dc3-a), where the instance would get no IPv4 address.
        TENANT_NET=""
        while read -r net_id net_name; do
          if [[ -n "$(openstack subnet list --network "$net_id" --ip-version 4 -f value -c ID 2>/dev/null)" ]]; then
            TENANT_NET="$net_name"; break
          fi
        done < <(openstack network list --internal -f value -c ID -c Name)
        if [[ -z "$TENANT_NET" ]]; then
          bad "No internal network with an IPv4 subnet in $OS_REGION_NAME"
          exit 1
        fi
        info "Tenant network: $TENANT_NET"

        # ---- 4. Boot instance ----
        # Nova refuses a flavor whose root disk is smaller than the image's
        # virtual size (Amazon Linux images declare 25 GiB, the default
        # flavor has 20 GB). Upsize to the smallest flavor with a large
        # enough disk and at least the same RAM.
        IMG_VSIZE=$(openstack image show -f value -c virtual_size "$IMG_NAME" 2>/dev/null || echo "")
        if [[ "$IMG_VSIZE" =~ ^[0-9]+$ ]]; then
          need_gb=$(( (IMG_VSIZE + 1073741823) / 1073741824 ))
          flv_disk=$(openstack flavor show -f value -c disk "$FLAVOR")
          flv_ram=$(openstack flavor show -f value -c ram "$FLAVOR")
          if (( flv_disk < need_gb )); then
            bigger=$(openstack flavor list --public -f json --long | python3 -c '
        import json, sys
        need, ram = int(sys.argv[1]), int(sys.argv[2])
        ok = [f for f in json.load(sys.stdin) if f["Disk"] >= need and f["RAM"] >= ram]
        ok.sort(key=lambda f: (f["Disk"], f["RAM"], f["VCPUs"]))
        print(ok[0]["Name"] if ok else "")
        ' "$need_gb" "$flv_ram")
            if [[ -z "$bigger" ]]; then
              bad "No flavor with a ${need_gb} GB disk for this image"
              exit 1
            fi
            info "Image needs ${need_gb} GB, $FLAVOR has ${flv_disk} GB: using $bigger"
            FLAVOR="$bigger"
          fi
        fi
        info "Boot $SRV_NAME (flavor=$FLAVOR)"
        openstack server create \
          --image "$IMG_NAME" \
          --flavor "$FLAVOR" \
          --key-name "$KEY_NAME" \
          --security-group "$SG_NAME" \
          --network "$TENANT_NET" \
          --wait \
          "$SRV_NAME" >/dev/null
        srv_status=$(openstack server show -f value -c status "$SRV_NAME")
        if [[ "$srv_status" != "ACTIVE" ]]; then
          bad "Server not ACTIVE (got $srv_status)"
          openstack console log show "$SRV_NAME" | tail -80 || true
          exit 1
        fi
        ok "Instance ACTIVE"

        # ---- 5. Public address ----
        # Projects without a private network land the instance directly on
        # a public provider network (Infomaniak's ext-net1): it already has
        # a global IPv4 and a floating IP cannot be associated (no router).
        # Use that address when present, otherwise allocate a floating IP.
        IP=$(openstack server show "$SRV_NAME" -f json -c addresses | python3 -c '
        import ipaddress, re, sys
        ips = re.findall(r"\b(?:\d{1,3}\.){3}\d{1,3}\b", sys.stdin.read())
        print(next((i for i in ips if ipaddress.ip_address(i).is_global), ""))
        ')
        if [[ -n "$IP" ]]; then
          info "Public IP on $TENANT_NET: $IP (no floating IP needed)"
        else
          FIP=$(openstack floating ip create --description "$TAG" "$EXTNET" -f value -c floating_ip_address)
          # Export right away so cleanup releases it even if a later step fails.
          echo "fip=$FIP" >> "$GITHUB_OUTPUT"
          openstack server add floating ip "$SRV_NAME" "$FIP"
          IP="$FIP"
          info "Floating IP: $FIP"
        fi

        # ---- 6. Probe SSH (TCP-open + handshake) ----
        end=$((SECONDS + SSH_TIMEOUT))
        while (( SECONDS < end )); do
          if timeout 5 bash -c "</dev/tcp/$IP/22" 2>/dev/null; then
            if ssh -i "$WORK/id" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                   -o ConnectTimeout=5 -o BatchMode=yes \
                   "${LOGIN_USER}@${IP}" true 2>/dev/null; then
              ok "SSH reachable as $LOGIN_USER@$IP"
              break
            fi
          fi
          sleep 8
        done
        if (( SECONDS >= end )); then
          bad "SSH never came up within ${SSH_TIMEOUT}s"
          openstack console log show "$SRV_NAME" | tail -100 || true
          exit 1
        fi

        SSH="ssh -i $WORK/id -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 ${LOGIN_USER}@${IP}"

        # ---- 7. Identity + cloud-init status ----
        UNAME=$($SSH 'uname -a' || echo '')
        info "uname: $UNAME"

        # cloud-init status: portable across distros; ignore on systems
        # without cloud-init in $PATH (we still passed cloud-init since
        # SSH key was injected, but `cloud-init status` may not be in the
        # default user PATH on minimal images: fall back to a log peek).
        ci=$($SSH 'command -v cloud-init >/dev/null && cloud-init status --wait --long 2>&1 || sudo cat /var/log/cloud-init.log 2>/dev/null | tail -3' || echo '')
        if echo "$ci" | grep -q "status: done"; then
          ok "cloud-init reported 'status: done'"
        elif echo "$ci" | grep -q "status: error"; then
          bad "cloud-init in error state"
          # The serial console is often empty on cloud images: read the
          # cause over SSH instead (detailed status + warnings/errors).
          echo "::group::cloud-init status --long"
          echo "$ci"
          echo "::endgroup::"
          echo "::group::cloud-init warnings and errors"
          $SSH 'sudo grep -E "WARNING|ERROR|failed" /var/log/cloud-init.log | tail -20' || true
          echo "::endgroup::"
          echo "::group::cloud-init tracebacks"
          $SSH 'sudo grep -A25 "^Traceback" /var/log/cloud-init.log | tail -80' || true
          echo "::endgroup::"
        else
          # Last resort: check that cloud-init at least wrote a final-message
          if $SSH 'sudo grep -q "Cloud-init.*finished" /var/log/cloud-init.log 2>/dev/null'; then
            ok "cloud-init final-message present in /var/log/cloud-init.log"
          else
            ok "cloud-init binary not in PATH but SSH+key injection worked (best-effort)"
          fi
        fi

        # ---- 8. Network egress ----
        # Retry: right after cloud-init the guest resolver can still be
        # settling (observed as a one-off failure on an otherwise good image).
        dns_ok=0
        for _ in 1 2 3 4 5 6; do
          if $SSH 'getent hosts deb.debian.org >/dev/null 2>&1 || nslookup deb.debian.org >/dev/null 2>&1'; then
            dns_ok=1; break
          fi
          sleep 5
        done
        if [[ "$dns_ok" -eq 1 ]]; then
          ok "DNS resolution works inside guest"
        else
          bad "DNS resolution failed inside guest"
          $SSH 'cat /etc/resolv.conf' || true
        fi

        echo "" >> "$SUMMARY"
        if [[ "$FAIL" -ne 0 ]]; then
          echo "**Result:** ❌ runtime smoke failed" >> "$SUMMARY"
        else
          echo "**Result:** ✅ runtime smoke passed (boot + cloud-init + SSH + DNS on Infomaniak)" >> "$SUMMARY"
        fi

        # Exit code captured here so the cleanup step always runs.
        # (tag was exported earlier so cleanup also runs on partial-failure paths.)
        echo "fail=$FAIL"     >> "$GITHUB_OUTPUT"
        echo "fip=${FIP:-}"   >> "$GITHUB_OUTPUT"

    - name: Cleanup OpenStack resources
      if: always() && steps.prereq.outputs.should_run == 'true' && steps.smoke.outputs.tag != ''
      shell: bash
      env:
        OS_AUTH_URL:                       ${{ inputs.os_auth_url }}
        OS_REGION_NAME:                    ${{ steps.smoke.outputs.region || inputs.os_region_name }}
        OS_AUTH_TYPE:                      v3applicationcredential
        OS_APPLICATION_CREDENTIAL_ID:      ${{ inputs.os_application_credential_id }}
        OS_APPLICATION_CREDENTIAL_SECRET:  ${{ inputs.os_application_credential_secret }}
        OS_IDENTITY_API_VERSION:           '3'
        OS_INTERFACE:                      public
        TAG:                               ${{ steps.smoke.outputs.tag }}
        FIP:                               ${{ steps.smoke.outputs.fip }}
      run: |
        set +e
        echo "::group::Cleanup $TAG"
        # Server first (releases the FIP attachment).
        openstack server delete --wait "$TAG" 2>/dev/null
        if [[ -n "$FIP" ]]; then
          openstack floating ip delete "$FIP" 2>/dev/null
        fi
        # Also release any floating IP tagged for this run (covers paths
        # where the address was never exported).
        for id in $(openstack floating ip list -f value -c ID -c Description 2>/dev/null | awk -v t="$TAG" '$2==t{print $1}'); do
          openstack floating ip delete "$id" 2>/dev/null
        done
        openstack keypair delete "$TAG" 2>/dev/null
        openstack security group delete "$TAG" 2>/dev/null
        # Iterate by ID so duplicate-name leftovers from earlier failed
        # runs at the same RUN_ID get purged in one pass.
        for id in $(openstack image list -f value -c ID --name "$TAG" 2>/dev/null); do
          openstack image delete "$id" 2>/dev/null
        done
        echo "::endgroup::"

    - name: Fail run on smoke failure
      if: steps.smoke.outputs.fail == '1'
      shell: bash
      run: |
        echo "::error::runtime smoke failed, see step summary"
        exit 1
